unbind r
bind r source-file ~/.tmux.conf

# Set variables for prayer plugin
run-shell '
  if [ -f "$HOME/.config/tmux/prayer.env" ]; then
    set -a
    . "$HOME/.config/tmux/prayer.env"
    set +a
    tmux set -g @prayer_latitude "$MY_LATITUDE"
    tmux set -g @prayer_longitude "$MY_LONGITUDE"
  fi
'

set -g prefix C-s
set -g mouse on

set -g extended-keys on
set -g allow-passthrough on
set -g -a terminal-features ',ghostty:RGB'
set -g cursor-style bar
# set -ga terminal-features "xterm-kitty:extkeys"

# New session binding
bind-key S new-session

# Join pane
bind-key H join-pane -v -s !
bind-key V join-pane -h -s !

# Bind select and copy keys in copy mode to also be vi bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# New panes open in working directory of current pane
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# For a thin cursor
set -ga terminal-overrides ",*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[6 q'

set-window-option -g mode-keys vi

# Switch panes using Prefix + hjkl
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -sg escape-time 10
set-option -g focus-events on
set-option -g renumber-windows on

bind -n S-Enter send-keys "\e[13;2u"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'abdallahsoliman00/tmux-catppuccin-prayertime'
set -g @prayer_method '5'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style rounded
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
run ~/.tmux/plugins/tmux/catppuccin.tmux
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right '#{E:@catppuccin_status_prayer}'
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
# set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
